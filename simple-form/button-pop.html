<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>Button Pop-up Demo</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #182230;
            background: #f4f6fb;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(119, 91, 255, 0.12), transparent 38%),
                radial-gradient(ellipse at 90% 85%, rgba(38, 174, 190, 0.12), transparent 34%),
                #f4f6fb;
        }

        .card {
            width: min(100%, 540px);
            padding: clamp(32px, 7vw, 64px);
            text-align: center;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(35, 45, 75, 0.12);
            animation: card-enter 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #6d5ce8;
            font-size: 0.78rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.2rem);
            letter-spacing: -0.055em;
            line-height: 1.08;
        }

        .intro {
            max-width: 36ch;
            margin: 18px auto 30px;
            color: #667085;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .open-button,
        .close-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 54px;
            padding: 0 26px;
            border: 0;
            border-radius: 16px;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
        }

        .open-button {
            background: linear-gradient(135deg, #7057ed, #4c75e8);
            box-shadow: 0 12px 24px rgba(92, 94, 224, 0.28);
        }

        .open-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 30px rgba(92, 94, 224, 0.36);
        }

        .open-button:active,
        .close-button:active {
            transform: translateY(0) scale(0.98);
        }

        .open-button:focus-visible,
        .close-button:focus-visible,
        .dialog-close:focus-visible {
            outline: 3px solid #a99cff;
            outline-offset: 4px;
        }

        .open-button .arrow {
            font-size: 1.2rem;
            transition: transform 180ms ease;
        }

        .open-button:hover .arrow {
            transform: translateX(4px);
        }

        .popup {
            width: min(440px, calc(100% - 32px));
            max-width: none;
            max-height: calc(100% - 32px);
            padding: 0;
            overflow: visible;
            color: inherit;
            background: transparent;
            border: 0;
        }

        .popup::backdrop {
            background: rgba(22, 27, 45, 0.48);
            backdrop-filter: blur(7px);
        }

        .popup[open] {
            animation: popup-enter 360ms cubic-bezier(0.2, 0.85, 0.25, 1) both;
        }

        .popup[open]::backdrop {
            animation: backdrop-enter 260ms ease-out both;
        }

        .popup.is-closing {
            animation: popup-exit 220ms ease-in both;
        }

        .popup.is-closing::backdrop {
            animation: backdrop-exit 220ms ease-in both;
        }

        .popup-content {
            position: relative;
            padding: 42px 36px 36px;
            text-align: center;
            background: #fff;
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 26px;
            box-shadow: 0 30px 90px rgba(12, 20, 45, 0.28);
        }

        .dialog-close {
            position: absolute;
            top: 14px;
            right: 14px;
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            padding: 0;
            color: #697386;
            background: #f2f4f8;
            border: 0;
            border-radius: 12px;
            font-size: 1.35rem;
            line-height: 1;
            cursor: pointer;
            transition: color 160ms ease, background-color 160ms ease, transform 160ms ease;
        }

        .dialog-close:hover {
            color: #182230;
            background: #e8eaf2;
            transform: rotate(90deg);
        }

        .success-icon {
            display: grid;
            width: 72px;
            height: 72px;
            margin: 0 auto 22px;
            place-items: center;
            color: #fff;
            background: linear-gradient(145deg, #36c99b, #20a886);
            border-radius: 23px;
            box-shadow: 0 12px 26px rgba(32, 168, 134, 0.24);
            font-size: 2rem;
            animation: icon-pop 500ms 120ms cubic-bezier(0.2, 1.5, 0.4, 1) both;
        }

        .popup h2 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: -0.04em;
        }

        .popup p {
            margin: 12px 0 26px;
            color: #667085;
            line-height: 1.65;
        }

        .close-button {
            width: 100%;
            background: #202b45;
        }

        .close-button:hover {
            background: #344261;
            box-shadow: 0 10px 22px rgba(32, 43, 69, 0.18);
        }

        @keyframes card-enter {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popup-enter {
            from { opacity: 0; transform: translateY(18px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes popup-exit {
            to { opacity: 0; transform: translateY(10px) scale(0.97); }
        }

        @keyframes backdrop-enter {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes backdrop-exit {
            to { opacity: 0; }
        }

        @keyframes icon-pop {
            from { opacity: 0; transform: scale(0.65) rotate(-12deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        @media (max-width: 480px) {
            .popup-content {
                padding: 40px 24px 26px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">A little interaction</p>
        <h1>Make your next click feel special.</h1>
        <p class="intro">Press the button to reveal a polished pop-up with a smooth entrance and exit.</p>
        <button class="open-button" id="openPopup" type="button" aria-haspopup="dialog" aria-controls="popup">
            Open the pop-up <span class="arrow" aria-hidden="true">→</span>
        </button>
    </main>

    <dialog class="popup" id="popup" aria-labelledby="popupTitle" aria-describedby="popupDescription">
        <div class="popup-content">
            <button class="dialog-close" id="closeIcon" type="button" aria-label="Close pop-up">×</button>
            <div class="success-icon" aria-hidden="true">✓</div>
            <h2 id="popupTitle">You made it!</h2>
            <p id="popupDescription">Your button is working beautifully. This pop-up is ready for your own message or next step.</p>
            <button class="close-button" id="closePopup" type="button">Sounds good</button>
        </div>
    </dialog>

    <script src="button-pop.js" defer></script>
</body>
</html>
